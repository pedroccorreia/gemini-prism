<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" fill="none">
  <defs>
    <linearGradient id="bannerBg" x1="0" y1="0" x2="1200" y2="340" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="45%" stop-color="#080D18" />
      <stop offset="100%" stop-color="#04060A" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.4" />
    </pattern>

    <filter id="glowBanner" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <linearGradient id="sparkGradBanner" x1="300" y1="170" x2="380" y2="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#4285F4"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <linearGradient id="prismFrameBanner" x1="115" y1="268" x2="265" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#E0F2FE" stop-opacity="1"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.95"/>
    </linearGradient>

    <radialGradient id="sparkHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4285F4" stop-opacity="0.42"/>
      <stop offset="60%" stop-color="#8B5CF6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bannerBg)" />
  <rect width="1200" height="340" rx="16" fill="url(#grid)" />
  <rect x="0.5" y="0.5" width="1199" height="339" rx="15.5" stroke="#1E293B" stroke-width="1" />

  <!-- Left Ambient Glow behind Mark -->
  <circle cx="220" cy="170" r="140" fill="#38BDF8" fill-opacity="0.06" filter="url(#glowBanner)" />

  <!-- ==================== LEFT: 9-RAY OPTICAL CONVERGENCE MARK ==================== -->
  <!-- 9 Input Rays (y from 98 to 242, step 18) hitting left prism edge (206,62 -> 98,266) -->
  <g stroke-width="2" stroke-linecap="round" filter="url(#glowBanner)" opacity="0.9">
    <line x1="28" y1="98"  x2="187" y2="98"  stroke="#7DD3FC" />
    <line x1="28" y1="116" x2="177" y2="116" stroke="#7DD3FC" />
    <line x1="28" y1="134" x2="168" y2="134" stroke="#38BDF8" />
    <line x1="28" y1="152" x2="158" y2="152" stroke="#38BDF8" />
    <line x1="28" y1="170" x2="149" y2="170" stroke="#60A5FA" />
    <line x1="28" y1="188" x2="139" y2="188" stroke="#818CF8" />
    <line x1="28" y1="206" x2="130" y2="206" stroke="#818CF8" />
    <line x1="28" y1="224" x2="120" y2="224" stroke="#A78BFA" />
    <line x1="28" y1="242" x2="111" y2="242" stroke="#F472B6" />
  </g>

  <!-- Connector Names on Beams -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="8.5" font-weight="600" fill="#94A3B8" letter-spacing="0.5">
    <text x="32" y="94">GMAIL</text>
    <text x="32" y="112">CALENDAR</text>
    <text x="32" y="130">DRIVE</text>
    <text x="32" y="148">CHAT</text>
    <text x="32" y="166">DIRECTORY</text>
    <text x="32" y="184">JIRA</text>
    <text x="32" y="202">CONFLUENCE</text>
    <text x="32" y="220">SLACK</text>
    <text x="32" y="238">HUBSPOT</text>
  </g>

  <!-- Prism Outer Bevel -->
  <polygon points="206,62 98,266 314,266"
           stroke="url(#prismFrameBanner)" stroke-width="4" stroke-linejoin="round"
           fill="#0B132B" fill-opacity="0.58" />

  <!-- Prism Inner Bevel -->
  <polygon points="206,106 136,244 276,244"
           stroke="url(#prismFrameBanner)" stroke-width="1.8" stroke-linejoin="round"
           fill="#0284C7" fill-opacity="0.09" />

  <line x1="206" y1="62"  x2="206" y2="106" stroke="url(#prismFrameBanner)" stroke-width="1.8" opacity="0.6" />
  <line x1="98"  y1="266" x2="136" y2="244" stroke="url(#prismFrameBanner)" stroke-width="1.8" opacity="0.6" />
  <line x1="314" y1="266" x2="276" y2="244" stroke="url(#prismFrameBanner)" stroke-width="1.8" opacity="0.6" />

  <!-- Internal Refraction Lines converging to right face focal point (264, 170) -->
  <g stroke="#E0F2FE" stroke-width="1.6" opacity="0.82" filter="url(#glowBanner)">
    <line x1="187" y1="98"  x2="264" y2="170" />
    <line x1="177" y1="116" x2="264" y2="170" />
    <line x1="168" y1="134" x2="264" y2="170" />
    <line x1="158" y1="152" x2="264" y2="170" />
    <line x1="149" y1="170" x2="264" y2="170" />
    <line x1="139" y1="188" x2="264" y2="170" />
    <line x1="130" y1="206" x2="264" y2="170" />
    <line x1="120" y1="224" x2="264" y2="170" />
    <line x1="111" y1="242" x2="264" y2="170" />
  </g>

  <!-- Converged Beam Exit -->
  <line x1="264" y1="170" x2="314" y2="170" stroke="#38BDF8" stroke-width="3.2" filter="url(#glowBanner)" />

  <!-- Gemini Star Halo & Spark -->
  <circle cx="344" cy="170" r="50" fill="url(#sparkHalo)" />
  <g transform="translate(344, 170)" filter="url(#glowBanner)">
    <path d="M 0,-34 Q 0,-3 28,0 Q 0,3 0,34 Q 0,3 -28,0 Q 0,-3 0,-34 Z" fill="url(#sparkGradBanner)" />
    <circle cx="0" cy="0" r="4" fill="#FFFFFF" />
  </g>

  <!-- ==================== RIGHT: BRAND IDENTITY & TEXT ==================== -->
  <g transform="translate(422, 42)">
    <rect width="416" height="26" rx="13" fill="#0F172A" stroke="#334155" stroke-width="1" />
    <circle cx="15" cy="13" r="4" fill="#00F5D4" />
    <text x="27" y="17"
          font-family="system-ui, -apple-system, sans-serif"
          font-size="11"
          font-weight="700"
          letter-spacing="1.4"
          fill="#38BDF8">AUTONOMOUS IAC · GEMINI ENTERPRISE ENGINE</text>
  </g>

  <!-- Title: PRISM -->
  <text x="422" y="122"
        font-family="system-ui, -apple-system, 'SF Pro Display', 'Inter', 'Google Sans', sans-serif"
        font-size="56"
        font-weight="800"
        letter-spacing="16"
        fill="#F8FAFC">PRISM</text>

  <!-- Subtitle -->
  <text x="422" y="158"
        font-family="system-ui, -apple-system, 'Inter', sans-serif"
        font-size="19.5"
        font-weight="500"
        fill="#E2E8F0">Refracting enterprise knowledge into one governed assistant.</text>

  <!-- Crisp Value Line -->
  <text x="422" y="186"
        font-family="system-ui, -apple-system, 'Inter', sans-serif"
        font-size="13.5"
        font-weight="400"
        fill="#94A3B8">Multi-Env Terraform · Stages 0–5 State Machine · Zero-Destroy Plan Guard · Auto-Licensed Seats</text>

  <!-- Row 1: Federated + Actions Connector Pills -->
  <g transform="translate(422, 212)" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">
    <rect x="0" y="0" width="176" height="28" rx="7" fill="#1E293B" stroke="#475569" stroke-width="0.9" />
    <text x="88" y="18" fill="#E2E8F0" text-anchor="middle">✦ Workspace + Actions</text>

    <rect x="184" y="0" width="136" height="28" rx="7" fill="#1E293B" stroke="#475569" stroke-width="0.9" />
    <text x="252" y="18" fill="#E2E8F0" text-anchor="middle">👥 People Directory</text>

    <rect x="328" y="0" width="118" height="28" rx="7" fill="#1E293B" stroke="#475569" stroke-width="0.9" />
    <text x="387" y="18" fill="#E2E8F0" text-anchor="middle">🔷 Jira Cloud</text>

    <rect x="454" y="0" width="122" height="28" rx="7" fill="#1E293B" stroke="#475569" stroke-width="0.9" />
    <text x="515" y="18" fill="#E2E8F0" text-anchor="middle">📘 Confluence</text>

    <rect x="584" y="0" width="126" height="28" rx="7" fill="#1E293B" stroke="#475569" stroke-width="0.9" />
    <text x="647" y="18" fill="#E2E8F0" text-anchor="middle">⚡ Slack + MCP</text>
  </g>

  <!-- Row 2: CRM, Governance & Safety Pills -->
  <g transform="translate(422, 248)" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">
    <rect x="0" y="0" width="128" height="28" rx="7" fill="#1E293B" stroke="#475569" stroke-width="0.9" />
    <text x="64" y="18" fill="#E2E8F0" text-anchor="middle">🧡 HubSpot CRM</text>

    <rect x="136" y="0" width="194" height="28" rx="7" fill="#0F172A" stroke="#818CF8" stroke-width="1" />
    <text x="233" y="18" fill="#A5B4FC" text-anchor="middle">🛡️ GEAP Governance Ready</text>

    <rect x="338" y="0" width="196" height="28" rx="7" fill="#0F172A" stroke="#38BDF8" stroke-width="1" />
    <text x="436" y="18" fill="#7DD3FC" text-anchor="middle">🔒 Non-Destructive Guard</text>

    <rect x="542" y="0" width="168" height="28" rx="7" fill="#0F172A" stroke="#00F5D4" stroke-width="1" />
    <text x="626" y="18" fill="#5EEAD4" text-anchor="middle">🤖 Human + Agent CLI</text>
  </g>
</svg>
