    <text x="45" y="26" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#00F5D4" text-anchor="middle">STAGE 5</text>
    <text x="170" y="26" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#5EEAD4" text-anchor="end">Agent + UAT</text>
    <text x="12" y="54" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">Verify &amp; Handoff</text>
    <text x="12" y="76" font-family="system-ui, sans-serif" font-size="11.5" fill="#94A3B8">Polls connector ACTIVE</text>
    <text x="12" y="92" font-family="system-ui, sans-serif" font-size="11.5" fill="#94A3B8">health, prints Web App</text>
    <text x="12" y="108" font-family="system-ui, sans-serif" font-size="11.5" fill="#94A3B8">URLs &amp; GEAP manifest.</text>
    <rect x="10" y="136" width="162" height="26" rx="6" fill="#080D18" stroke="#115E59" />
    <text x="91" y="153" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" font-weight="600" fill="#00F5D4" text-anchor="middle">make verify</text>
