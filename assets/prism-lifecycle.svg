    <text x="164" y="26" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#7DD3FC" text-anchor="end">Agent</text>
    <text x="12" y="54" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">Connectors &amp; App</text>
    <text x="12" y="76" font-family="system-ui, sans-serif" font-size="11.5" fill="#94A3B8">Provisions Federated +</text>
    <text x="12" y="92" font-family="system-ui, sans-serif" font-size="11.5" fill="#94A3B8">Actions stores, Search</text>
    <text x="12" y="108" font-family="system-ui, sans-serif" font-size="11.5" fill="#94A3B8">Engine &amp; Assistant.</text>
