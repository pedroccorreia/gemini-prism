    <rect x="12" y="12" width="66" height="20" rx="5" fill="#0C2438" />
    <text x="45" y="26" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#38BDF8" text-anchor="middle">STAGE 4</text>
    <text x="164" y="26" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#7DD3FC" text-anchor="end">Agent</text>
    <text x="12" y="54" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">Seat Distribution</text>
    <text x="12" y="76" font-family="system-ui, sans-serif" font-size="11.5" fill="#94A3B8">Routes Billing Account</text>
    <text x="12" y="92" font-family="system-ui, sans-serif" font-size="11.5" fill="#94A3B8">pool quotas to projects</text>
    <text x="12" y="108" font-family="system-ui, sans-serif" font-size="11.5" fill="#94A3B8">with auto-registration.</text>
    <rect x="10" y="136" width="156" height="26" rx="6" fill="#080D18" stroke="#1E293B" />
    <text x="88" y="153" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" font-weight="600" fill="#38BDF8" text-anchor="middle">make licenses</text>
