<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="prismWire" x1="16" y1="52" x2="38" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#E0F2FE" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="38" y1="31" x2="58" y2="31" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#4285F4"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 5 Input Rays (left) -->
  <g stroke="#BAE6FD" stroke-width="1.2" stroke-linecap="round" opacity="0.85">
    <line x1="4" y1="26" x2="25" y2="28" />
    <line x1="4" y1="29" x2="23" y2="30.5" />
    <line x1="4" y1="32" x2="21" y2="33" />
    <line x1="4" y1="35" x2="19" y2="35.5" />
    <line x1="4" y1="38" x2="17" y2="38" />
  </g>

  <!-- Prism Outer Triangle -->
  <polygon points="31,10 13,48 49,48" stroke="url(#prismWire)" stroke-width="2.2" stroke-linejoin="round" fill="#0C1425" fill-opacity="0.6" />

  <!-- Prism Inner Bevel Triangle -->
  <polygon points="31,18 20,44 42,44" stroke="url(#prismWire)" stroke-width="1.2" stroke-linejoin="round" fill="none" opacity="0.4" />
  <line x1="31" y1="10" x2="31" y2="18" stroke="url(#prismWire)" stroke-width="1.2" opacity="0.5" />
  <line x1="13" y1="48" x2="20" y2="44" stroke="url(#prismWire)" stroke-width="1.2" opacity="0.5" />
  <line x1="49" y1="48" x2="42" y2="44" stroke="url(#prismWire)" stroke-width="1.2" opacity="0.5" />

  <!-- Refraction Convergence Beams Inside Prism -->
  <g stroke="#E0F2FE" stroke-width="1.1" opacity="0.9">
    <line x1="25" y1="28" x2="42" y2="31" />
    <line x1="23" y1="30.5" x2="42" y2="31" />
    <line x1="21" y1="33" x2="42" y2="31" />
    <line x1="19" y1="35.5" x2="42" y2="31" />
    <line x1="17" y1="38" x2="42" y2="31" />
  </g>

  <!-- Gemini 4-Point Star Spark (right) -->
  <path d="M 50,31 Q 50,21 50,21 Q 50,31 60,31 Q 50,31 50,41 Q 50,31 40,31 Q 50,31 50,21 Z" 
        fill="url(#sparkGrad)" filter="url(#glow)" />
</svg>
