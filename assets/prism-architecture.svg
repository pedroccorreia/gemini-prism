<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 410" width="1200" height="410" fill="none">
  <defs>
    <linearGradient id="archBg" x1="0" y1="0" x2="1200" y2="410" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>
    <pattern id="archGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.6" stroke-opacity="0.35" />
    </pattern>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38BDF8" />
    </marker>
    <marker id="arrPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#818CF8" />
    </marker>
    <marker id="arrTeal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#00F5D4" />
    </marker>
  </defs>

  <rect width="1200" height="410" rx="14" fill="url(#archBg)" />
  <rect width="1200" height="410" rx="14" fill="url(#archGrid)" />
  <rect x="0.5" y="0.5" width="1199" height="409" rx="13.5" stroke="#1E293B" stroke-width="1" />

  <!-- Header -->
  <text x="28" y="34" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2" fill="#38BDF8">PRISM REFERENCE ARCHITECTURE — PER CUSTOMER ENVIRONMENT ({customer}-{env})</text>
  <rect x="978" y="15" width="194" height="24" rx="12" fill="#0F172A" stroke="#334155" />
  <text x="1075" y="31" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11" font-weight="600" fill="#94A3B8" text-anchor="middle">location = "global"</text>

  <!-- COLUMN 1: ENTERPRISE SOURCES & AUTH -->
  <g transform="translate(24, 54)">
    <rect width="276" height="332" rx="12" fill="#0F172A" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" />
    <text x="18" y="28" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="0.8" fill="#94A3B8">1. ENTERPRISE TENANTS &amp; AUTH</text>

    <!-- Workspace Box -->
    <rect x="14" y="42" width="248" height="72" rx="8" fill="#131F35" stroke="#38BDF8" stroke-width="1" />
    <text x="26" y="62" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">Google Workspace &amp; Directory</text>
    <text x="26" y="80" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Gmail · Calendar · Drive · Chat · People</text>
    <text x="26" y="98" font-family="ui-monospace, monospace" font-size="10" fill="#7DD3FC">DWD (21-digit SA ID) + 3LO Actions</text>

    <!-- Atlassian Box -->
    <rect x="14" y="124" width="248" height="66" rx="8" fill="#131F35" stroke="#60A5FA" stroke-width="1" />
    <text x="26" y="144" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">Atlassian Jira &amp; Confluence</text>
    <text x="26" y="161" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Issues, Projects, Spaces, Pages, Blogs</text>
    <text x="26" y="178" font-family="ui-monospace, monospace" font-size="9.5" fill="#93C5FD">OAuth 2.0 3LO · Shared Jira Fallback</text>

    <!-- Slack Box -->
    <rect x="14" y="200" width="248" height="58" rx="8" fill="#131F35" stroke="#818CF8" stroke-width="1" />
    <text x="26" y="220" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">Slack Enterprise / Workspace</text>
    <text x="26" y="237" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Channels, Files + Remote MCP Actions</text>
    <text x="26" y="251" font-family="ui-monospace, monospace" font-size="9.5" fill="#A5B4FC">Google-Managed OAuth (0 secrets) / BYO</text>

    <!-- HubSpot Box -->
    <rect x="14" y="268" width="248" height="50" rx="8" fill="#131F35" stroke="#F472B6" stroke-width="1" />
    <text x="26" y="288" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">HubSpot CRM</text>
    <text x="26" y="305" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Contacts · Companies · Deals · Tickets</text>
  </g>

  <!-- COLUMN 2: GCP PROJECT FOUNDATION & CONNECTORS -->
  <g transform="translate(338, 54)">
    <rect width="504" height="332" rx="12" fill="#0F172A" fill-opacity="0.9" stroke="#38BDF8" stroke-width="1.3" />
    <text x="18" y="28" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.5" fill="#38BDF8">2. ISOLATED GCP PROJECT (DISCOVERY ENGINE + OPTIONAL GEAP)</text>

    <!-- Foundation Strip -->
    <rect x="16" y="42" width="472" height="62" rx="8" fill="#0B1324" stroke="#334155" />
    <text x="28" y="62" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#E2E8F0">Stage 1 Foundation</text>
    <text x="28" y="80" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">Location ACL: <tspan fill="#7DD3FC" font-family="ui-monospace, monospace">GSUITE</tspan>  ·  Service Agent (<tspan fill="#7DD3FC" font-family="ui-monospace, monospace">gcp-sa-discoveryengine</tspan>)</text>
    <text x="28" y="96" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">User Store (<tspan fill="#5EEAD4" font-family="ui-monospace, monospace">enable_license_auto_register = true</tspan>)</text>

    <!-- Federated Data Connectors Box -->
    <rect x="16" y="116" width="230" height="142" rx="8" fill="#131F35" stroke="#38BDF8" stroke-width="1" />
    <text x="28" y="138" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">Data &amp; Action Connectors</text>
    <text x="28" y="158" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">• Zero-copy <tspan fill="#7DD3FC" font-family="ui-monospace, monospace">FEDERATED</tspan> search</text>
    <text x="28" y="176" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">• BAP &amp; MCP <tspan fill="#7DD3FC" font-family="ui-monospace, monospace">ACTIONS</tspan> writeback</text>
    <text x="28" y="194" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">• Incremental Directory sync</text>
    <text x="28" y="212" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">• Preserves <tspan fill="#94A3B8" font-family="ui-monospace, monospace">extra_data_store_ids</tspan></text>
    <text x="28" y="238" font-family="ui-monospace, monospace" font-size="10" fill="#38BDF8">create_before_destroy = true</text>

    <!-- Unified Engine & Assistant Box -->
    <rect x="262" y="116" width="226" height="142" rx="8" fill="#161F38" stroke="#818CF8" stroke-width="1.2" />
    <text x="274" y="138" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">Unified Engine &amp; Assistant</text>
    <text x="274" y="158" font-family="ui-monospace, monospace" font-size="10.5" fill="#C7D2FE">{customer}-{env}-search-engine</text>
    <text x="274" y="178" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">• Enterprise Intranet Search</text>
    <text x="274" y="196" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">• <tspan fill="#A5B4FC" font-family="ui-monospace, monospace">default_assistant</tspan> + LLM</text>
    <text x="274" y="214" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">• Google Web Grounding</text>
    <text x="274" y="238" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#5EEAD4">✦ Real-Time Per-User ACLs</text>

    <!-- Internal Arrow: Connectors -> Engine -->
    <line x1="246" y1="187" x2="260" y2="187" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrBlue)" />

    <!-- Optional GEAP Governance Bar -->
    <rect x="16" y="270" width="472" height="48" rx="8" fill="#131129" stroke="#818CF8" stroke-dasharray="4 3" stroke-width="1" />
    <text x="28" y="290" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#C4B5FD">Optional GEAP Foundation (<tspan font-family="ui-monospace, monospace" font-size="10.5">geap_governance_mode = "foundation"</tspan>)</text>
    <text x="28" y="307" font-family="system-ui, sans-serif" font-size="10.5" fill="#94A3B8">16 APIs (Registry, Identity, Gateway, Model Armor, Topology) · 4 P4SAs · 6 Roles</text>
  </g>

  <!-- COLUMN 3: IDENTITY & BILLING POOL -->
  <g transform="translate(880, 54)">
    <rect width="296" height="332" rx="12" fill="#0F172A" fill-opacity="0.85" stroke="#334155" stroke-width="1.2" />
    <text x="18" y="28" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="0.8" fill="#00F5D4">3. ACCESS &amp; SEAT LICENSING</text>

    <!-- Cloud Identity Groups -->
    <rect x="14" y="42" width="268" height="126" rx="8" fill="#131F35" stroke="#00F5D4" stroke-width="1" />
    <text x="26" y="64" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">Cloud Identity IAM Groups</text>
    <text x="26" y="86" font-family="ui-monospace, monospace" font-size="10.5" fill="#5EEAD4">{customer}-{env}-admins@</text>
    <text x="26" y="102" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">↳ Project Discovery Engine + GEAP Admin</text>
    <text x="26" y="126" font-family="ui-monospace, monospace" font-size="10.5" fill="#5EEAD4">{customer}-{env}-users@</text>
    <text x="26" y="142" font-family="system-ui, sans-serif" font-size="11" fill="#94A3B8">↳ Engine-scoped <tspan font-family="ui-monospace, monospace">discoveryengine.user</tspan></text>
    <text x="26" y="158" font-family="system-ui, sans-serif" font-size="10.5" fill="#CBD5E1">↳ Seat auto-granted on first login</text>

    <!-- Cloud Billing Seat Pool -->
    <rect x="14" y="184" width="268" height="134" rx="8" fill="#131F35" stroke="#818CF8" stroke-width="1" />
    <text x="26" y="206" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#F8FAFC">Cloud Billing License Pool</text>
    <text x="26" y="226" font-family="ui-monospace, monospace" font-size="10.5" fill="#A5B4FC">BillingAccountLicenseConfig</text>
    <text x="26" y="248" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">• <tspan font-family="ui-monospace, monospace" fill="#7DD3FC">make licenses</tspan> distributes</text>
    <text x="36" y="264" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">N seats to <tspan font-family="ui-monospace, monospace">prod</tspan> / M to <tspan font-family="ui-monospace, monospace">non-prod</tspan></text>
    <text x="26" y="286" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">• Emits <tspan font-family="ui-monospace, monospace" fill="#94A3B8">license_allocations.json</tspan></text>
    <text x="26" y="304" font-family="system-ui, sans-serif" font-size="11" fill="#CBD5E1">• Reconciles User Store binding</text>
  </g>

  <!-- Cross-Column Flow Arrows -->
  <line x1="300" y1="215" x2="336" y2="215" stroke="#38BDF8" stroke-width="2.2" marker-end="url(#arrBlue)" />
  <line x1="880" y1="145" x2="844" y2="185" stroke="#00F5D4" stroke-width="2" marker-end="url(#arrTeal)" />
  <line x1="880" y1="250" x2="844" y2="115" stroke="#818CF8" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arrPurple)" />
</svg>
