name: "Prism — Terraform CI"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    name: "Terraform Format, Validate & Test"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.8"
          terraform_wrapper: false

      - name: Terraform Format Check
        run: terraform fmt -check -diff

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

      - name: Run Test Harness
        id: test_harness
        run: |
          python3 -u scripts/test_red.py 2>&1 | tee test_run.log

      - name: Publish Test Summary
        if: always()
        run: |
          if [ -f test_run.log ]; then
            echo "### Test Harness Log" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            cat test_run.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            # Also emit failed lines as GitHub annotations so they appear in API/UI
            grep -E '(FAIL|ERROR|Error|Traceback|Exception)' test_run.log | head -n 10 | while IFS= read -r line; do
              echo "::error title=TestFailure::$line"
            done
          fi
