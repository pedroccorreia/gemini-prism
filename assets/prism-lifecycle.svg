  <!-- Bottom Safety Guardrail Bar -->
  <g transform="translate(24, 256)">
    <rect width="1152" height="44" rx="9" fill="#0B1324" stroke="#334155" stroke-width="1" />
    <text x="20" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700" fill="#A5B4FC">🛡️ ALWAYS-ON SAFETY RAILS:  <tspan font-family="ui-monospace, SFMono-Regular, monospace" font-weight="600" fill="#E2E8F0">plan_guard.py</tspan> <tspan font-weight="400" fill="#94A3B8">blocks any destroy/replace</tspan>   <tspan fill="#475569">│</tspan>   <tspan font-family="ui-monospace, SFMono-Regular, monospace" font-weight="600" fill="#E2E8F0">status.py</tspan> <tspan font-weight="400" fill="#94A3B8">halts on foreign state</tspan>   <tspan fill="#475569">│</tspan>   <tspan font-family="ui-monospace, SFMono-Regular, monospace" font-weight="600" fill="#E2E8F0">deletion_policy = "PREVENT"</tspan> <tspan font-weight="400" fill="#94A3B8">on projects</tspan></text>
  </g>
</svg>
