    <rect x="12" y="12" width="66" height="20" rx="5" fill="#3B2506" />
    <text x="45" y="26" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#FBBF24" text-anchor="middle">STAGE 2</text>
    <text x="164" y="26" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#FBBF24" text-anchor="end">HUMAN GATE</text>
    <text x="12" y="54" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#FEF3C7">Admin Auth Gate</text>
    <text x="12" y="76" font-family="system-ui, sans-serif" font-size="11.5" fill="#D6D3D1">Authorize Workspace DWD,</text>
    <text x="12" y="92" font-family="system-ui, sans-serif" font-size="11.5" fill="#D6D3D1">3LO OAuth &amp; SaaS keys,</text>
    <text x="12" y="108" font-family="system-ui, sans-serif" font-size="11.5" fill="#D6D3D1">then unlock Stage 3.</text>
    <rect x="10" y="136" width="156" height="26" rx="6" fill="#0D0A05" stroke="#78350F" />
    <text x="88" y="153" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10" font-weight="600" fill="#FBBF24" text-anchor="middle">make enable-connectors</text>
