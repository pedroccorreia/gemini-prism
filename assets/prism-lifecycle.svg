    <rect width="176" height="174" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2" />
    <rect x="12" y="12" width="66" height="20" rx="5" fill="#0C2438" />
    <text x="45" y="26" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#38BDF8" text-anchor="middle">STAGE 1</text>
    <text x="164" y="26" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#7DD3FC" text-anchor="end">Agent</text>
    <text x="12" y="54" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">Foundation Apply</text>
    <text x="12" y="76" font-family="system-ui, sans-serif" font-size="11.5" fill="#94A3B8">Creates GCP projects,</text>
    <text x="12" y="92" font-family="system-ui, sans-serif" font-size="11.5" fill="#94A3B8">GSUITE IdP, IAM groups</text>
    <text x="12" y="108" font-family="system-ui, sans-serif" font-size="11.5" fill="#94A3B8">&amp; DWD 21-digit Client ID.</text>
    <rect x="10" y="136" width="156" height="26" rx="6" fill="#080D18" stroke="#1E293B" />
    <text x="88" y="153" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" font-weight="600" fill="#38BDF8" text-anchor="middle">make apply-foundation</text>
  </g>

